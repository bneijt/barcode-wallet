[package]
name = "barcode-wallet"
version = "1.0.3"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = { version = "0.8", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlVideoElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "ImageData",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MediaTrackConstraints",
    "Navigator",
    "Window",
    "File",
    "FileList",
    "Blob",
    "BlobPropertyBag",
    "HtmlAnchorElement",
    "Url",
    "HtmlMediaElement",
    "ServiceWorkerContainer",
    "ShareData",
    "Clipboard",
    "DomException",
] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
barcoders = "2.0.0"
qrcode = "0.14.1"
image = "0.25.8"
rxing = { version = "0.9.2", default-features = false, features = [
    "image",
    "image_formats",
    "serde",
    "encoding_rs",
    "decoders",
    "full_barcode_format_support",
    "multi_barcode_readers",
] }
# rxing enables chrono's default "clock" feature, whose SystemTime::now() panics on
# wasm32-unknown-unknown. The "wasmbind" feature makes Utc::now() use the JS clock.
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
gloo-utils = "0.2"
gloo-timers = { version = "0.3", features = ["futures"] }
send_wrapper = "0.6"
indexed_db_futures = "0.6.4"
